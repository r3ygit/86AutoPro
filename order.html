<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>86AutoPro Order</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
<style>
.box{max-width:500px;margin:20px auto;padding:30px;text-align:center;border-radius:28px}
.qr{width:100%;max-width:260px;border-radius:20px;margin:20px auto;display:block;background:#fff}
.price-box{margin:18px 0;padding:16px;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;font-size:24px;font-weight:800}
.paid-box{display:flex;align-items:center;justify-content:center;gap:12px;margin:20px 0;padding:16px;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;font-weight:700;cursor:pointer}
.paid-box input{width:22px;height:22px;margin:0;accent-color:var(--red)}
.btn{width:100%}
</style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="logo-crop"><img src="logo.PNG" alt="86AutoPro"></a>
  <div class="nav-links"><a href="cart.html">← Cart</a></div>
</nav>

<div class="card box">
  <h1 style="font-size:30px;font-weight:900;margin-bottom:8px">Complete Your Order</h1>
  <h2 id="carName" style="font-size:18px;color:var(--mut);margin-bottom:22px"></h2>

  <div id="formStep">
    <input id="instagram" placeholder="Instagram ID">
    <input id="cpmid" placeholder="CPM ID">
    <button class="btn" onclick="showPayment()" style="margin-top:10px">NEXT</button>
  </div>

  <div id="paymentStep" style="display:none;">
    <img id="qrImage" class="qr" alt="Payment QR">
    <div class="price-box">💳 Amount To Pay: ₹<span id="payAmount"></span></div>
    <p style="color:var(--mut)">⚠️ Make sure payment is completed before submitting.</p>
    <p style="margin-top:8px">Are you sure you have paid?</p>
    <label class="paid-box"><input type="checkbox" id="paidCheck"><span>Payment Completed</span></label>
    <button class="btn" id="submitBtn" onclick="submitOrder()" disabled style="opacity:.5">SUBMIT ORDER</button>
  </div>
</div>

<script>
emailjs.init({ publicKey:"reBhf90INvnNqOLn8" });

const params = new URLSearchParams(window.location.search);
const car = params.get("cars") || "Unknown Car";
const price = params.get("total") || "0";
const owner = params.get("owner") || "r3y";

document.getElementById("carName").textContent = `${car} • ₹${price}`;
document.getElementById("payAmount").textContent = price;
document.getElementById("qrImage").src = owner === "r3y" ? "myqr.jpg" : "partnerqr.jpg";

function showPayment(){
  const insta = document.getElementById("instagram").value;
  const cpm = document.getElementById("cpmid").value;
  if(!insta || !cpm){ alert("Please enter Instagram ID and CPM ID"); return; }
  document.getElementById("formStep").style.display = "none";
  document.getElementById("paymentStep").style.display = "block";
  window.scrollTo({ top:0, behavior:"smooth" });
}

const paidCheck = document.getElementById("paidCheck");
const submitBtn = document.getElementById("submitBtn");
paidCheck.addEventListener("change", () => {
  submitBtn.disabled = !paidCheck.checked;
  submitBtn.style.opacity = paidCheck.checked ? "1" : ".5";
});

function submitOrder(){
  if(!paidCheck.checked){ alert("Please confirm payment first"); return; }
  emailjs.send("service_vooqt6p", "template_i3art5p", {
    car_name: car,
    price: price,
    instagram_id: document.getElementById("instagram").value,
    cpm_id: document.getElementById("cpmid").value
  })
  .then(() => { document.getElementById("successPopup").style.display = "flex"; })
  .catch((error) => { console.log(error); alert("Error: " + JSON.stringify(error)); });
}
</script>

<div id="successPopup" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;justify-content:center;align-items:center">
  <div class="card" style="padding:40px;text-align:center;max-width:350px;width:90%;border-radius:28px">
    <div style="font-size:70px;color:var(--red)">✓</div>
    <h2 style="margin:10px 0">Order Submitted!</h2>
    <p style="color:var(--mut)">Your order was received successfully.</p>
    <a href="https://www.instagram.com/86autopro" target="_blank" class="btn" style="margin-top:20px">📸 Contact 86AutoPro</a>
  </div>
</div>
</body>
</html>
