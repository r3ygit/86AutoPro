<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>86AutoPro Order</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>

body{
background:
radial-gradient(circle at top right,#ff7a0030,transparent 40%),
radial-gradient(circle at bottom left,#ff950020,transparent 40%),
#050505;
color:white;
font-family:'Inter',sans-serif;
padding:20px;
text-align:center;
min-height:100vh;
}
.card{
max-width:550px;
margin:auto;

background:rgba(255,255,255,.08);
backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);

border:1px solid rgba(255,255,255,.12);
border-radius:35px;

padding:30px;

box-shadow:
0 20px 80px rgba(255,140,0,.15),
0 0 60px rgba(255,140,0,.08);
}
h1{
font-size:42px;
font-weight:800;
margin-bottom:10px;
}

h2{
font-size:24px;
font-weight:700;
color:#ff9c2b;
margin-bottom:25px;
}
input{
width:100%;
padding:18px;
margin:12px 0;

border:none;
border-radius:18px;

background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);

color:white;
font-size:16px;
font-weight:600;
}

input:focus{
outline:none;
box-shadow:
0 0 20px rgba(255,122,0,.4);
}
button{
width:100%;
padding:18px;

border:none;
border-radius:18px;

background:linear-gradient(
135deg,
#ff9500,
#ff5e00
);

color:white;
font-weight:800;
font-size:17px;

cursor:pointer;

box-shadow:
0 0 35px rgba(255,122,0,.45);

transition:.3s;
}

button:hover{
transform:translateY(-3px);
}
.qr{
width:100%;
max-width:320px;
border-radius:25px;
margin:25px auto;
display:block;

box-shadow:
0 0 40px rgba(255,255,255,.1);
}
.price-box{
margin:20px 0;
padding:18px;

background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.12);
border-radius:20px;

font-size:28px;
font-weight:800;
color:#ff8a00;
}

</style>

</head>
<body>

<div class="card">

<h1>86AutoPro Order</h1>

<h2 id="carName"></h2>

<div id="formStep">

<input
id="instagram"
placeholder="Instagram ID">

<input
id="cpmid"
placeholder="CPM ID">

<button onclick="showPayment()">
NEXT
</button>

</div>

<div id="paymentStep">

<img src="qr.jpg" class="qr">

<div class="price-box">
💳 Amount To Pay: ₹<span id="payAmount"></span>
</div>

<p>
⚠️ Make sure payment is completed before submitting.
</p>

<p>
Are you sure you have paid?
</p>

<button onclick="submitOrder()">
SUBMIT ORDER
</button>

</div>

</div>

<script>

emailjs.init({
publicKey:"0XlgqGZvdzI9UcgXi"
});

const params =
new URLSearchParams(window.location.search);

const car =
params.get("car");

const price =
params.get("price");

document.getElementById("payAmount").textContent = price;

function showPayment(){

document.getElementById("formStep").style.display="none";

document.getElementById("paymentStep").style.display="block";

}

function submitOrder(){

emailjs.send(
"service_vooqt6p",
"template_i3art5p",
{
car_name:car,
price:price,
instagram_id:
document.getElementById("instagram").value,
cpm_id:
document.getElementById("cpmid").value
}
)
.then(()=>{

alert("Order Submitted!");

window.location.href =
"https://www.instagram.com/86autopro";

});

}

</script>

</body>
</html>
