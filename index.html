<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>86AutoPro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#050505;
color:white;
min-height:100vh;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
width:700px;
height:700px;
background:#8b5cf640;
filter:blur(220px);
top:-250px;
right:-250px;
z-index:-1;
}

body::after{
content:'';
position:fixed;
width:700px;
height:700px;
background:#a855f740;
filter:blur(220px);
bottom:-250px;
left:-250px;
z-index:-1;
}

.navbar{
position:sticky;
top:15px;
margin:15px;
padding:18px;
text-align:center;
font-size:30px;
font-weight:800;

background:rgba(255,255,255,.08);
backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);

border:1px solid rgba(255,255,255,.12);
border-radius:25px;

z-index:100;
}

.hero{
text-align:center;
padding:100px 20px 70px;
}

.hero h1{
font-size:70px;
font-weight:800;
margin-bottom:10px;
}

.hero p{
font-size:20px;
opacity:.75;
}

.section{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.title{
font-size:45px;
font-weight:800;
text-align:center;
margin-bottom:35px;
}

#carsContainer{
display:flex;
flex-direction:column;
gap:30px;
}

.car-card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);

border:1px solid rgba(255,255,255,.12);
border-radius:30px;

padding:20px;

box-shadow:
0 10px 40px rgba(0,0,0,.3);
}

.car-card img{
  width:100%;
  aspect-ratio:9/16;
  object-fit:cover;
  border-radius:20px;
  margin-bottom:20px;
  display:block;
}

.car-name{
font-size:34px;
font-weight:800;
margin-bottom:10px;
}

.price{
font-size:38px;
font-weight:800;
color:#c084fc;
margin-bottom:20px;
}

.buy-btn{
display:inline-block;

padding:15px 28px;

background:linear-gradient(
135deg,
#c084fc,
#8b5cf6
);

color:white;
text-decoration:none;
font-weight:700;

border-radius:15px;

transition:.3s;
}

.buy-btn:hover{
transform:translateY(-3px);
}

.loading{
text-align:center;
font-size:20px;
opacity:.7;
}

.footer{
padding:40px;
text-align:center;
opacity:.6;
}

@media(max-width:768px){

.hero h1{
font-size:50px;
}

.title{
font-size:35px;
}

.car-name{
font-size:26px;
}

.price{
font-size:30px;
}

}

</style>
</head>
<body>

<div class="navbar">
86AutoPro
</div>

<section class="hero">

<h1>86AutoPro</h1>

<p>Premium Car Parking Multiplayer Marketplace</p>

</section>

<section class="section">

<h2 class="title">
Available Cars
</h2>

<div id="carsContainer">

<div class="loading">
Loading cars...
</div>

</div>

</section>

<div class="footer">
86AutoPro © 2026
</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://juwpebbsyeixiaxqhvok.supabase.co",
"sb_publishable_YR1oDYdZjescuBhIIg5Cgw_MW7Yy8Dv"
);

async function loadCars(){

const container =
document.getElementById("carsContainer");

const { data, error } =
await supabase
.from("cars")
.select("*")
.order("id",{ascending:false});


if(error){

container.innerHTML = `
<div class="loading">
Error loading cars
</div>
`;

console.error(error);
return;
}

if(!data || data.length === 0){

container.innerHTML = `
<div class="loading">
No cars available
</div>
`;

return;
}

container.innerHTML = "";

data.forEach(car=>{

container.innerHTML += `

<div class="car-card">

<img src="${car.image}" alt="${car.name}">

<h2 class="car-name">
${car.name}
</h2>

<div class="price">
₹${car.price}
</div>

<a
href="https://tally.so/r/Y56RNB"
target="_blank"
class="buy-btn">
BUY NOW
</a>

</div>

`;

});

}


loadCars();

</script>

</body>
</html>
