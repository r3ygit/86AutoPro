<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>86AutoPro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
min-height:100vh;
}

body::before{
content:'';
position:fixed;
width:700px;
height:700px;
background:#00ff8840;
filter:blur(220px);
top:-250px;
right:-250px;
z-index:-1;
}

body::after{
content:'';
position:fixed;
width:600px;
height:600px;
background:#0071e340;
filter:blur(200px);
bottom:-250px;
left:-250px;
z-index:-1;
}

.navbar{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:1300px;
padding:18px 30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(30px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:1000;
}

.logo{
font-size:28px;
font-weight:800;
}

.hero{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:120px 20px;
}

.hero h1{
font-size:85px;
font-weight:800;
margin-bottom:15px;
}

.hero p{
font-size:22px;
opacity:.75;
margin-bottom:30px;
}

.btn{
display:inline-block;
padding:18px 35px;
background:white;
color:black;
text-decoration:none;
font-weight:700;
border-radius:18px;
transition:.3s;
}

.btn:hover{
transform:translateY(-5px);
}

.section{
max-width:1300px;
margin:auto;
padding:80px 20px;
}

.title{
font-size:50px;
font-weight:800;
text-align:center;
margin-bottom:50px;
}

.car-card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(30px);
border:1px solid rgba(255,255,255,.1);
border-radius:35px;
padding:25px;
}

.gallery{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:30px;
}

.gallery img{
width:100%;
aspect-ratio:9/16;
object-fit:cover;
border-radius:25px;
display:block;
}

.car-name{
font-size:38px;
font-weight:800;
margin-bottom:10px;
}

.price{
font-size:45px;
font-weight:800;
color:#00ff88;
margin-bottom:25px;
}

.buy-btn{
display:inline-block;
padding:18px 40px;
background:white;
color:black;
text-decoration:none;
font-weight:800;
border-radius:18px;
}

.buy-btn:hover{
transform:translateY(-5px);
}

.footer{
padding:50px;
text-align:center;
opacity:.6;
}

@media(max-width:768px){

.hero h1{
font-size:55px;
}

.hero p{
font-size:18px;
}

.gallery{
grid-template-columns:1fr;
}

.gallery img{
aspect-ratio:9/16;
}

.car-name{
font-size:28px;
}

.price{
font-size:35px;
}

}
#carsContainer{
display:flex;
flex-direction:column;
gap:30px;
}

</style>
</head>
<body>

<nav class="navbar">
<div class="logo">86AutoPro</div>
</nav>

<section class="hero">

<div>

<h1>86AutoPro</h1>

<p>Premium Car Parking Multiplayer Marketplace</p>

<a href="#cars" class="btn">
Browse Cars
</a>

</div>

</section>

<section id="cars" class="section">

<h2 class="title">
Available Cars
</h2>

<div id="carsContainer"></div>

</section>

<footer class="footer">
86AutoPro © 2026
</footer>
<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://juwpebbsyeixiaxqhvok.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1d3BlYmJzeWVpeGlheHFodm9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTkwNTAsImV4cCI6MjEwNDE3NTA1MH0.ucbnOyAsh1Ht2Uql5WHRfsLzzQrdyUBzaBGUwW-h46cE"
);

async function loadCars(){

const { data,error } =
await supabase
.from("cars")
.select("*")
.order("id",{ascending:false});

if(error){
console.log(error);
return;
}

const container =
document.getElementById("carsContainer");

container.innerHTML="";

data.forEach(car=>{

alert(car.name);

container.innerHTML += `

container.innerHTML += `

<div class="car-card">

<div class="gallery">

<img src="${car.image}" alt="${car.name}">

</div>

<h2 class="car-name">
${car.name}
</h2>

<div class="price">
₹${car.price}
</div>

<a
href="https://tally.so/r/Y56RNB"
target="_blank"
class="buy-btn">
BUY NOW
</a>

</div>

`;

});

}

loadCars();

</script>
</body>
</html>
