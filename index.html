<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>86AutoPro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:
radial-gradient(circle at top right,#ff7a0030,transparent 40%),
radial-gradient(circle at bottom left,#ff950020,transparent 40%),
#050505;
color:white;
min-height:100vh;
overflow-x:hidden;
animation:fadeIn 1s ease;
}

body::before{
content:'';
position:fixed;
width:700px;
height:700px;
background:#ff7a0040;
filter:blur(220px);
top:-250px;
right:-250px;
z-index:-1;
animation:pulse 6s infinite;
}

body::after{
content:'';
position:fixed;
width:700px;
height:700px;
background:#ff950040;
filter:blur(220px);
bottom:-250px;
left:-250px;
z-index:-1;
animation:pulse 6s infinite;
}
.navbar{
position:sticky;
top:15px;
margin:15px;
padding:18px;
text-align:center;
font-size:30px;
font-weight:800;

background:rgba(255,255,255,.08);
backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);

border:1px solid rgba(255,255,255,.12);
border-radius:25px;

z-index:100;
}
.navbar{
box-shadow:
0 10px 40px rgba(255,140,0,.25),
0 0 80px rgba(255,140,0,.15);
}

.navbar:hover{
transform:translateY(-2px);
transition:.3s;
}
.hero{
text-align:center;
padding:100px 20px 70px;
}

.hero h1{
font-size:70px;
font-weight:800;
margin-bottom:10px;
}

.hero p{
font-size:20px;
opacity:.75;
}

.section{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.title{
font-size:45px;
font-weight:800;
text-align:center;
margin-bottom:35px;
}

#carsContainer{
display:flex;
flex-direction:column;
gap:30px;
}

.car-card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);

border:1px solid rgba(255,255,255,.12);
border-radius:30px;

padding:20px;

box-shadow:
0 10px 40px rgba(0,0,0,.3);
}

.gallery{
display:flex;
gap:12px;
overflow-x:auto;
scroll-snap-type:x mandatory;
margin-bottom:20px;
}

.gallery img{
width:100%;
min-width:100%;
aspect-ratio:9/16;
object-fit:cover;
border-radius:20px;
scroll-snap-align:center;
}
.gallery-controls{
display:flex;
justify-content:center;
gap:15px;
margin-bottom:20px;
}

.gallery-controls button{
width:55px;
height:55px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.12);
backdrop-filter:blur(20px);
color:white;
font-size:24px;
font-weight:700;
cursor:pointer;
}
.car-name{
font-size:34px;
font-weight:800;
margin-bottom:10px;
}

.price{
font-size:38px;
font-weight:800;
color:#ff8a00;
margin-bottom:20px;
}

.buy-btn{
display:inline-block;

padding:15px 28px;

background:linear-gradient(
135deg,
#ff9500,
#ff5e00
);
box-shadow:
0 0 25px rgba(255,122,0,.4);
color:white;
text-decoration:none;
font-weight:700;

border-radius:15px;

transition:.3s;
}

.buy-btn:hover{
transform:translateY(-3px);
}

.loading{
text-align:center;
font-size:20px;
opacity:.7;
}

.footer{
padding:40px;
text-align:center;
opacity:.6;
}
@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes pulse{
0%,100%{
opacity:.25;
}
50%{
opacity:.5;
}
}
@media(max-width:768px){

.hero h1{
font-size:50px;
}

.title{
font-size:35px;
}

.car-name{
font-size:26px;
}

.price{
font-size:30px;
}

}
.available-badge{
background:#16a34a;
color:white;
padding:15px 28px;
border-radius:15px;
font-weight:700;
display:inline-block;
text-decoration:none;
}
.sold-badge{
background:#dc2626;
color:white;
padding:15px 28px;
border-radius:15px;
font-weight:700;
display:inline-block;
}
.car-card{
position:relative;
}

.status-badge{
position:absolute;
top:35px;
right:35px;
padding:12px 24px;
border-radius:999px;
font-weight:700;
font-size:16px;
z-index:10;
}

.available{
background:#16a34a;
color:white;
}

.sold{
background:#dc2626;
color:white;
}
  .car-card{
overflow:hidden;
transition:.4s;
}

.car-card::before{
content:'';
position:absolute;
inset:0;
background:linear-gradient(
120deg,
transparent,
rgba(255,255,255,.08),
transparent
);
transform:translateX(-100%);
transition:.8s;
pointer-events:none;
}

.car-card:hover::before{
transform:translateX(100%);
}

.car-card:hover{
transform:translateY(-8px);
box-shadow:
0 20px 80px rgba(255,140,0,.18);
}
</style>
</head>
<body>

<div class="navbar">
86AutoPro
</div>

<section class="hero">

<h1>86AutoPro</h1>

<p>Premium Car Parking Multiplayer Marketplace</p>

</section>

<section class="section">

<h2 class="title">
Available Cars
</h2>

<div id="carsContainer">

<div class="loading">
Loading cars...
</div>

</div>

</section>

<div class="footer">
86AutoPro © 2026
</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://juwpebbsyeixiaxqhvok.supabase.co",
"sb_publishable_YR1oDYdZjescuBhIIg5Cgw_MW7Yy8Dv"
);

async function loadCars(){

const container =
document.getElementById("carsContainer");

const { data, error } =
await supabase
.from("cars")
.select("*")
.order("status",{ascending:true})
.order("id",{ascending:false});


if(error){

container.innerHTML = `
<div class="loading">
Error loading cars
</div>
`;

console.error(error);
return;
}

if(!data || data.length === 0){

container.innerHTML = `
<div class="loading">
No cars available
</div>
`;

return;
}

container.innerHTML = "";

data.forEach(car=>{

container.innerHTML += `

<div class="car-card">

<div class="status-badge ${car.status === 'sold' ? 'sold' : 'available'}">
${car.status === 'sold' ? 'SOLD OUT' : 'AVAILABLE'}
</div>

<div class="gallery-wrapper">

<button class="gallery-btn prev"
onclick="this.nextElementSibling.scrollBy({left:-350,behavior:'smooth'})">
‹
</button>

<div class="gallery" id="gallery${car.id}">

<img src="${car.image}" alt="${car.name}">

${car.image2 ? `
<img src="${car.image2}" alt="${car.name}">
` : ''}

${car.image3 ? `
<img src="${car.image3}" alt="${car.name}">
` : ''}

</div>

<div class="gallery-controls">

<button onclick="
document.getElementById('gallery${car.id}')
.scrollBy({left:-350,behavior:'smooth'})
">
⬅
</button>

<button onclick="
document.getElementById('gallery${car.id}')
.scrollBy({left:350,behavior:'smooth'})
">
➡
</button>

</div>

<button class="gallery-btn next"
onclick="this.previousElementSibling.scrollBy({left:350,behavior:'smooth'})">
›
</button>

</div>

<h2 class="car-name">
${car.name}
</h2>

<div class="price">
₹${car.price}
</div>

${car.status === "sold"
? ''
: `
<a
href="https://tally.so/r/Y56RNB"
target="_blank"
class="buy-btn">
BUY NOW
</a>
`
}

</div>

`;

});

}


loadCars();

</script>

</body>
</html>
