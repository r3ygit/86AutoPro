<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>Reset Password — 86AutoPro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<nav class="nav">
  <a href="index.html" class="logo-crop"><img src="logo.PNG" alt="86AutoPro"></a>
</nav>
<div class="card auth-box">
  <h1>Choose a new password</h1>
  <p class="sub">Use at least 8 characters.</p>
  <div id="msg" class="msg"></div>
  <form id="form">
    <input type="password" id="p1" placeholder="New password" minlength="8" autocomplete="new-password" required>
    <input type="password" id="p2" placeholder="Confirm new password" minlength="8" autocomplete="new-password" required>
    <button class="btn" type="submit">UPDATE PASSWORD</button>
  </form>
  <a href="login.html" class="btn btn-ghost" id="toLogin" style="display:none;width:100%;margin-top:12px">GO TO LOGIN</a>
</div>

<script type="module">
import { account, errMsg, say } from "./auth.js";
const p = new URLSearchParams(location.search);
const userId = p.get("userId"), secret = p.get("secret");
const msg = document.getElementById("msg");
const form = document.getElementById("form");

if (!userId || !secret) {
  form.style.display = "none";
  say(msg, "This reset link is invalid or has expired. Please request a new one.");
  document.getElementById("toLogin").style.display = "block";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const a = document.getElementById("p1").value, b = document.getElementById("p2").value;
  if (a !== b) return say(msg, "Passwords do not match.");
  try {
    await account.updateRecovery(userId, secret, a);
    form.style.display = "none";
    say(msg, "Password updated. You can now log in.", true);
    document.getElementById("toLogin").style.display = "block";
  } catch (err) { say(msg, errMsg(err)); }
});
</script>
</body>
</html>
