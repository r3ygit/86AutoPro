<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>86AutoPro Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#050505;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
}

body::before{
content:'';
position:fixed;
width:700px;
height:700px;
background:#8b5cf640;
filter:blur(220px);
top:-250px;
right:-250px;
z-index:-1;
}

body::after{
content:'';
position:fixed;
width:700px;
height:700px;
background:#a855f740;
filter:blur(220px);
bottom:-250px;
left:-250px;
z-index:-1;
}

.card{
width:100%;
max-width:550px;

background:rgba(255,255,255,.08);
backdrop-filter:blur(30px);

border:1px solid rgba(255,255,255,.12);
border-radius:30px;

padding:25px;
}

h1{
text-align:center;
margin-bottom:20px;
font-size:32px;
font-weight:800;
}

input{
width:100%;
padding:16px;
margin-bottom:15px;

background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.12);

border-radius:15px;
color:white;
}

button{
width:100%;
padding:16px;

border:none;
border-radius:15px;

background:linear-gradient(
135deg,
#c084fc,
#8b5cf6
);

color:white;
font-size:16px;
font-weight:700;

cursor:pointer;
}

.status{
margin-top:15px;
text-align:center;
font-weight:600;
}
</style>
</head>
<body>

<div class="card">

<h1>Add Car</h1>

<input
id="name"
placeholder="Car Name">

<input
id="price"
placeholder="Price">

<input
type="file"
id="photo"
accept="image/*">

<button onclick="addCar()">
Upload Car
</button>

<div id="status" class="status"></div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://juwpebbsyeixiaxqhvok.supabase.co",
"sb_publishable_YR1oDYdZjescuBhIIg5Cgw_MW7Yy8Dv"
);

window.addCar = async function(){

const name =
document.getElementById("name").value;

const price =
document.getElementById("price").value;

const file =
document.getElementById("photo").files[0];

const status =
document.getElementById("status");

if(!name || !price || !file){

status.innerHTML =
"❌ Fill all fields";

return;
}

status.innerHTML =
"📤 Uploading image...";

const fileName =
Date.now() + "-" + file.name;

const { error: uploadError } =
await supabase.storage
.from("cars")
.upload(fileName,file);

if(uploadError){

status.innerHTML =
"❌ Upload failed";

console.log(uploadError);

return;
}

const imageUrl =

`https://juwpebbsyeixiaxqhvok.supabase.co/storage/v1/object/public/cars/${fileName}`;

const { error: dbError } =
await supabase
.from("cars")
.insert([
{
name,
price,
image:imageUrl
}
]);

if(dbError){

status.innerHTML =
"❌ Database save failed";

console.log(dbError);

return;
}

status.innerHTML =
"✅ Car Added Successfully";

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("photo").value="";

};

</script>

</body>
</html>
