<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>86AutoPro Admin</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
width:100%;
max-width:500px;
background:#151515;
padding:30px;
border-radius:25px;
border:1px solid #333;
}

h1{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:12px;
background:#222;
color:white;
}
select{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:12px;
background:#222;
color:white;
}
button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#8b5cf6;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

#status{
margin-top:15px;
text-align:center;
}
#carsList{
margin-top:20px;
}

.car-item{
background:#222;
padding:15px;
border-radius:12px;
margin-bottom:10px;
}

.action-btn{
width:auto;
padding:10px 15px;
margin-right:10px;
margin-top:10px;
}

</style>
</head>
<body>

<div class="card">

<h1>86AutoPro Admin</h1>

<input
type="text"
id="name"
placeholder="Car Name">

<input
type="number"
id="price"
placeholder="Car Price">

<select id="status">
<option value="available">Available</option>
<option value="sold">Sold Out</option>
</select>

<input
type="file"
id="image"
accept="image/*">
  <input
type="file"
id="image2"
accept="image/*">

<input
type="file"
id="image3"
accept="image/*">

<button onclick="uploadCar()">
Add Car
</button>
<h2 style="margin-top:25px;">Cars</h2>

<div id="carsList"></div>
<div id="message"></div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL =
"https://juwpebbsyeixiaxqhvok.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YR1oDYdZjescuBhIIg5Cgw_MW7Yy8Dv";

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);
async function loadCars(){

const { data, error } =
await supabase
.from("cars")
.select("*")
.order("id",{ascending:false});

if(error) return;

const carsList =
document.getElementById("carsList");

carsList.innerHTML = "";

data.forEach(car=>{

carsList.innerHTML += `
<div class="car-item">

<b>${car.name}</b><br>
₹${car.price}

<br>

<button
class="action-btn"
onclick="deleteCar(${car.id})">
Delete
</button>

</div>
`;

});

}

window.deleteCar = async (id)=>{

const ok =
confirm("Delete this car?");

if(!ok) return;

await supabase
.from("cars")
.delete()
.eq("id",id);

loadCars();
};
window.uploadCar = async () => {

const name =
document.getElementById("name").value;

const price =
document.getElementById("price").value;

const file =
document.getElementById("image").files[0];

const file2 =
document.getElementById("image2").files[0];

const file3 =
document.getElementById("image3").files[0];

if(!name || !price || !file){
alert("Name, Price and Main Image required");
return;
}
document.getElementById("message").innerText =
"Uploading...";

const fileName =
Date.now() + "-" + file.name;

const { error: uploadError } =
await supabase.storage
.from("cars")
.upload(fileName,file);

if(uploadError){
alert(uploadError.message);
return;
}

const imageUrl =
`${SUPABASE_URL}/storage/v1/object/public/cars/${fileName}`;
  let imageUrl2 = null;
let imageUrl3 = null;

if(file2){

const fileName2 =
Date.now() + "-2-" + file2.name;

await supabase.storage
.from("cars")
.upload(fileName2,file2);

imageUrl2 =
`${SUPABASE_URL}/storage/v1/object/public/cars/${fileName2}`;

}

if(file3){

const fileName3 =
Date.now() + "-3-" + file3.name;

await supabase.storage
.from("cars")
.upload(fileName3,file3);

imageUrl3 =
`${SUPABASE_URL}/storage/v1/object/public/cars/${fileName3}`;

}

const { error } =
await supabase
.from("cars")
.insert([
{
name:name,
price:price,
status:
document.getElementById("status").value,

image:imageUrl,
image2:imageUrl2,
image3:imageUrl3
}
]);

if(error){
alert(error.message);
return;
}

document.getElementById("message").innerText =
"Car Added Successfully ✅";
document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("image").value="";
  document.getElementById("image2").value="";
document.getElementById("image3").value="";
loadCars();
};
loadCars();
</script>

</body>
</html>
