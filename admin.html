<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>86AutoPro Admin</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
width:100%;
max-width:500px;
background:#151515;
padding:30px;
border-radius:25px;
border:1px solid #333;
}

h1{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:12px;
background:#222;
color:white;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#8b5cf6;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

#status{
margin-top:15px;
text-align:center;
}
</style>
</head>
<body>

<div class="card">

<h1>86AutoPro Admin</h1>

<input
type="text"
id="name"
placeholder="Car Name">

<input
type="number"
id="price"
placeholder="Car Price">

<input
type="file"
id="image"
accept="image/*">

<button onclick="uploadCar()">
Add Car
</button>

<div id="status"></div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL =
"https://juwpebbsyeixiaxqhvok.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YR1oDYdZjescuBhIIg5Cgw_MW7Yy8Dv";

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);

window.uploadCar = async () => {

const name =
document.getElementById("name").value;

const price =
document.getElementById("price").value;

const file =
document.getElementById("image").files[0];

if(!name || !price || !file){
alert("Fill all fields");
return;
}

document.getElementById("status").innerText =
"Uploading...";

const fileName =
Date.now() + "-" + file.name;

const { error: uploadError } =
await supabase.storage
.from("cars")
.upload(fileName,file);

if(uploadError){
alert(uploadError.message);
return;
}

const imageUrl =
`${SUPABASE_URL}/storage/v1/object/public/cars/${fileName}`;

const { error } =
await supabase
.from("cars")
.insert([
{
name:name,
price:price,
image:imageUrl
}
]);

if(error){
alert(error.message);
return;
}

document.getElementById("status").innerText =
"Car Added Successfully ✅";

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("image").value="";
};

</script>

</body>
</html>
