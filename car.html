<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>86AutoPro Car Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
</head>
<body>
<nav class="nav">
  <a href="index.html" class="logo-crop"><img src="logo.PNG" alt="86AutoPro"></a>
  <div class="nav-links"><a href="cart.html" class="btn" style="padding:10px 18px;color:#fff">🛒 Cart</a></div>
</nav>
<div class="wrap" id="carDetails" style="max-width:900px"><div class="loading">Loading...</div></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
const supabase = createClient(
"https://juwpebbsyeixiaxqhvok.supabase.co",
"sb_publishable_YR1oDYdZjescuBhIIg5Cgw_MW7Yy8Dv"
);
const carId = new URLSearchParams(window.location.search).get("id");
const { data, error } = await supabase.from("cars").select("*").eq("id", carId).single();

if(data){
  await supabase.from("cars").update({ views: (data.views || 0) + 1 }).eq("id", carId);
  data.views = (data.views || 0) + 1;
  document.title = data.name + " — 86AutoPro";
  const sold = data.status === "sold";
  const thumbs = [data.image, data.image2, data.image3].filter(Boolean)
    .map(s => `<img src="${s}" alt="" onclick="document.getElementById('mainImage').src=this.src">`).join("");
  document.getElementById("carDetails").innerHTML = `
<a href="index.html" class="back">← Back to Marketplace</a>
<h1 style="font-size:clamp(30px,6vw,48px);font-weight:900;letter-spacing:-1px;margin-bottom:10px">${data.name}</h1>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px">
  <span class="pill ${sold ? 'sold' : 'available'}" style="cursor:default;border:0;font-size:12px;padding:7px 14px">${sold ? 'SOLD OUT' : 'AVAILABLE'}</span>
  <span style="color:var(--mut)">👁️ ${data.views || 0} Views</span>
</div>
<div class="price" style="font-size:34px">₹${data.price}</div>
<img id="mainImage" src="${data.image}" alt="${data.name}" class="main-car-image" style="max-width:520px;margin:0 auto 14px">
<div class="thumbs">${thumbs}</div>
<div class="panel">
  <h3>Seller</h3><p style="font-weight:700;font-size:18px">${data.seller || "Not Set"}</p>
  <h3 style="margin-top:22px">Description</h3><p style="color:var(--mut);line-height:1.7">${data.description || "No description"}</p>
</div>
<div class="actions">
  ${data.instagram ? `<a href="${data.instagram}" target="_blank" class="btn btn-ghost">📸 Contact Seller</a>` : ''}
  ${sold ? '' : `<button onclick="addToCart()" class="btn">🛒 ADD TO CART</button>`}
  <button onclick="shareCar()" class="btn btn-ghost">🔗 Share Car</button>
</div>`;
}else{
  document.getElementById("carDetails").innerHTML = '<div class="loading">Car not found.</div><a href="index.html" class="back">← Back</a>';
}

window.shareCar = async () => {
  if(navigator.share){ await navigator.share({ title: document.title, url: window.location.href }); }
  else{ await navigator.clipboard.writeText(window.location.href); alert("Car link copied!"); }
};
window.addToCart = () => {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push({ id: data.id, name: data.name, price: data.price, image: data.image, owner: data.owner });
  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Added To Cart 🛒");
};
</script>
</body>
</html>
