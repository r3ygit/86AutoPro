<!DOCTYPE html>
<html>
<head>
<title>86AutoPro Car Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div id="carDetails">
Loading...

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://juwpebbsyeixiaxqhvok.supabase.co",
"sb_publishable_YR1oDYdZjescuBhIIg5Cgw_MW7Yy8Dv"
);

const params =
new URLSearchParams(window.location.search);

const carId =
params.get("id");

const { data,error } =
await supabase
.from("cars")
.select("*")
.eq("id",carId)
.single();

if(data){

">

</a>

<div style="
font-size:40px;
font-weight:800;
color:#ff8a00;
margin:15px 0;
">
₹${data.price}
</div>

<div style="
display:inline-block;
padding:10px 20px;
border-radius:999px;
background:${data.status === 'sold' ? '#dc2626' : '#16a34a'};

">

<img src="${data.image}"
style="
width:100%;

${data.image2 ? `

${data.image3 ? `

${data.status === 'sold'

: `

href="https://tally.so/r/Y56RNB"
